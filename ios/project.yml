# Fallback only. If DebrisMapper.xcodeproj ever fails to open:
#   brew install xcodegen && cd ios && xcodegen
name: DebrisMapper
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  DebrisMapper:
    type: application
    platform: iOS
    sources: [DebrisMapper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.debrismapper
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Debris Mapper
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of storm debris to share on the neighborhood map.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Every report needs a location so it can be placed on the shared map.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice notes about a debris report.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
